spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: workboard
    password: Workboard!1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

workboard:
  cache:
    ttl-seconds: 600
  jwt:
    secret: workboard-local-secret-key-for-jwt-signing-2026
    access-expire-minutes: 30
    refresh-expire-days: 7
  post:
    max-title-length: 200
    max-content-length: 5000

logging:
  level:
    com.example.board: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
