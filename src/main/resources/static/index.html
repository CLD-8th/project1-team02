<!DOCTYPE html>
<html lang="ko">
<!--
    목록 화면

    대응 주제
      화면 연동 · 엔티티와 매핑 · 연관관계 매핑
      요청 응답 형태 분리 · 페이징과 정렬
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkBoard</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/index.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a class="logo" href="/index.html">
            <svg viewBox="0 0 28 28" width="34" height="34" aria-hidden="true">
                <rect x="2" y="4" width="24" height="20" rx="4" fill="none"
                      stroke="currentColor" stroke-width="2"/>
                <line x1="7" y1="11" x2="21" y2="11"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="7" y1="16" x2="16" y2="16"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>WorkBoard</span>
        </a>
        <div class="header-user" id="header-user"></div>
    </div>
</header>

<main class="site-main">

    <div id="message" class="message"></div>

    <div class="list-tools">
        <span class="count">전체 <strong id="count">0</strong>건</span>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th class="col-id">번호</th>
            <th>제목</th>
            <th class="col-writer">작성자</th>
            <th class="col-date">작성일</th>
        </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <div class="list-bottom">
        <a href="/form.html"><button class="btn-primary">공지 작성</button></a>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="search">
        <input type="text" id="department" placeholder="부서명 검색" autocomplete="off">
        <button class="btn-outline" onclick="search()">검색</button>
    </div>

</main>

<footer class="site-footer">
    <div class="footer-inner">&copy; 2026 CLD-08 PROJECT-1 TEAM02. All rights reserved.</div>
</footer>

</body>
</html>
